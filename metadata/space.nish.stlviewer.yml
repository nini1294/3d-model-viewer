AutoName: 3D Model Viewer
Summary: Fast, lightweight 3D STL & OBJ model viewer for Android

Description: |-
  A fast, lightweight, open-source 3D model viewer for Android.
  Zero trackers, no ads, and no internet permissions required.

  Features:
  * Binary and ASCII STL support (including custom CAD headers and truncated files)
  * Wavefront OBJ support (triangles, quads, and convex n-gons)
  * Hardware-accelerated OpenGL ES 3.0 rendering with 4x MSAA
  * Solid shaded, Solid + Edges, and Wireframe visualization modes
  * Intuitive multi-touch camera: 1-finger orbit, 2-finger pan, pinch zoom
  * Dynamic adaptive build-plate ground grid
  * Mesh physical stats: triangle count, bounding dimensions (mm), volume (cm³), and surface area (cm²)
  * Dark theme and Material You dynamic color themes

